# Baut SubPulse bei jedem Push auf den Hauptbranch und veröffentlicht es auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # manuell über den Actions-Tab auslösbar

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Projektseiten liegen unter /<repo>/, eine User-Seite (<name>.github.io) unter /.
          BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
